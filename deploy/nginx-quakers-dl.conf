# =============================================================================
# Quakers download mirror — the FAILOVER. Cloudflare R2 is the primary.
#
# Hostname split (see rclone-and-r2-setup.md for the reasoning):
#     dl.proto.bar     -> Cloudflare R2      (primary, $0 egress, global edge)
#     files.proto.bar  -> THIS Pi vhost      (failover, DNS-only / grey cloud)
#     play.proto.bar   -> the game server    (DNS-only / grey cloud — UDP)
#
# Serves the same content-addressed layout publish.py + rclone push:
#     /srv/nvme/quakers/dl/objects/<hh>/<hash>     immutable blobs
#     /srv/nvme/quakers/dl/manifests/<channel>.json
#
# WHY NOT MinIO: the Pi's MinIO keeps its data on the 7.2 GB root overlay, which cannot
# hold the 6.3 GB payload. The NVMe (~66 GB free) is the right home and the launcher only
# ever issues plain HTTP GETs (plus Range for resume), which nginx serves directly.
#
# INSTALL (on the Pi):
#   sudo mkdir -p /srv/nvme/quakers/dl
#   sudo cp nginx-quakers-dl.conf /etc/nginx/sites-available/quakers-dl.conf
#   sudo ln -s /etc/nginx/sites-available/quakers-dl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d files.proto.bar     # adds TLS + the HTTP->HTTPS redirect
#   sudo nginx -t && sudo systemctl reload nginx
# VERIFY:
#   curl -sI https://files.proto.bar/manifests/beta.json      # expect 200
#   curl -sI -r 0-99 https://files.proto.bar/objects/<hh>/<hash>   # expect 206 (resume works)
#
# NOTE: certbot needs files.proto.bar to be DNS-only (grey cloud) at validation time, or
# use DNS-01. It must STAY grey-clouded anyway — see the ToS note in rclone-and-r2-setup.md.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name files.proto.bar;

    root /srv/nvme/quakers/dl;
    autoindex off;
    disable_symlinks if_not_owner;

    # Range requests are what make the launcher resumable — nginx static serving
    # supports them natively; just don't put anything in front that strips them.
    location /objects/   { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /manifests/ { add_header Cache-Control "public, max-age=60"; }

    # ---- BANDWIDTH GUARD ----------------------------------------------------
    # This box also carries the live game server on the same 40 Mbps uplink. R2 is
    # primary so this vhost should be near-idle, but cap it so a failover surge can
    # never starve play. limit_rate is PER CONNECTION and the launcher opens 8 by
    # default, so 2m here is ~16 MB/s worst case per tester — pair it with a tc/HTB
    # class on the interface, or router QoS prioritising the game's UDP port.
    limit_rate 2m;

    access_log /var/log/nginx/quakers-dl.access.log;
}
