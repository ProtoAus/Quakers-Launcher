# quakers launcher config — ship this next to the launcher binary.
# On launch the launcher reads the manifest from the first reachable mirror, then downloads
# any missing/changed objects by hash (resumable, parallel), verifying each before use.
# It installs the files tagged for its own platform plus the shared "all" content, and sets
# the executable bit on the engine binaries it writes.
#
# Only `mirrors` is read today; the others are documented for the signing/self-update work (M3)
# and are ignored for now. CLI flags (--mirror, --channel, --concurrency, --install-dir) override.

channel     = "alpha"
install_dir = "."          # "." = alongside the launcher binary; the whole game lives here
concurrency = 8            # parallel download workers (the per-thread rows in the progress UI)

# Tried in order, per file, with automatic failover on error.
#
#   dl.proto.bar   Cloudflare R2 (bucket `quakers-dl`) via an R2 custom domain. Egress is free
#                  and there is no home connection behind it.
#
#                  It pointed at nginx on the proto.bar Pi until 2026-07-27, when a single
#                  tester's install took the house offline. The CDN was not bypassed -- every
#                  origin hit came from a Cloudflare edge IP -- but Cloudflare's cache is
#                  per-edge-SERVER, and the launcher opens 8 parallel workers that land on
#                  different machines in one PoP. Each missed and fetched independently, so the
#                  origin served 6.20 GB to deliver a 5.84 GB payload: a 2.96x re-fetch. Caching
#                  in front of a home uplink does not take the uplink out of the path.
#
#                  The Cache Rule (Hostname eq dl.proto.bar and starts_with(uri.path,
#                  "/objects/") -> Eligible for cache) still matters and carried over unchanged:
#                  objects are hash-named with no file extension, and Cloudflare's default
#                  caching is extension-driven, so without it every request is DYNAMIC.
#
# Only ONE mirror is listed on purpose, and it is deliberately NOT the Pi. A fallback pointing at
# the home connection just re-creates the outage above, less often. A dead hostname is worse than
# none -- the launcher burns a connect timeout per file on any path that reaches it. Add a second
# entry when a second HOST exists; see deploy/rclone-and-r2-setup.md.
mirrors = [
    "https://dl.proto.bar",
]

# --- M3 (not yet wired) ---
# Manifest signature check (ed25519). While false, the launcher still verifies every file's
# content hash from the manifest fetched over HTTPS.
verify_signature = false
# pubkey = "PUT-ED25519-PUBKEY-HERE"
